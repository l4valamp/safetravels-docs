# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: Rearview
site_description: Team field guide for Rearview, an isometric taxi-driving game.
site_url: https://l4valamp.github.io/safetravels-docs/
docs_dir: docs
exclude_docs: |
  /Templates/**

# Team landing pages are the main navigation; other notes remain linked/searchable.
nav:
  - Home: index.md
  - Art: Team Folders/Art/Art.md
  - Design: Team Folders/Design/Design.md
  - Tech: Team Folders/Tech/Tech.md
  - Sound: Team Folders/Sound/Sound.md
  - UI: Team Folders/UI/UI.md

theme:
  name: material
  custom_dir: overrides
  font: false
  palette: 
    scheme: slate
    primary: amber
    accent: deep orange
  
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

plugins:
  - search
  - awesome-pages #this is a plugin it doesnt recognize but works fine
  - databaseview:
      headless: true
  - entity #this is our custom plugin for variables

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
     alternate_style: true
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/rearview.css

extra_javascript:
  - javascripts/entities.js
