[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-databaseview-plugin"
version = "0.4.0"
description = "Publish Obsidian note links, native snapshots, or headless team category tables"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6,<2",
    "PyYAML>=6.0",
    "Markdown>=3.3.6",
]

[project.entry-points."mkdocs.plugins"]
databaseview = "mkdocs_databaseview_plugin.plugin:DBViewPlugin"


[tool.setuptools.packages.find]
where = ["src"]
