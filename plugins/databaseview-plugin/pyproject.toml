[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-databaseview-plugin"
version = "0.3.0"
description = "Publish exported Obsidian Bases snapshots and note links in MkDocs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mkdocs>=1.5",
    "PyYAML>=6.0",
    "Markdown>=3.3.6",
]

[project.entry-points."mkdocs.plugins"]
databaseview = "mkdocs_databaseview_plugin.plugin:DBViewPlugin"


[tool.setuptools.packages.find]
where = ["src"]
